version: "3.9"

services:
  web:
    build: .
    command: gunicorn app:app --bind 0.0.0.0:8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always

  worker:
    build: .
    command: python worker.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always
